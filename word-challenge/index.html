<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحدي الكلمات مع عبد الله</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#f8fafc;background:#0b1022}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#26376c,#0b1022 65%);display:grid;place-items:center;padding:20px}.app{width:min(100%,560px);padding:28px;background:#151e38;border:1px solid #39466d;border-radius:26px;box-shadow:0 24px 70px #0006;text-align:center}h1{font-size:clamp(25px,6vw,36px);margin:8px 0}p{color:#b9c5e0}.top{display:flex;justify-content:space-between;gap:8px;margin:22px 0}.stat{background:#202e50;padding:12px;border-radius:14px;flex:1}.stat strong{display:block;font-size:22px;color:#fbbf24}.bar{height:9px;background:#2b3757;border-radius:20px;overflow:hidden}.bar span{display:block;background:#34d399;height:100%;width:100%;transition:width .3s}.hint{margin:24px 0 12px;font-size:20px;font-weight:bold}.slots,.letters{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;min-height:60px;margin:14px 0}.tile{width:50px;height:54px;border:1px solid #6175ac;border-radius:12px;background:#263c70;color:white;font-size:26px;cursor:pointer}.tile:disabled{opacity:.25;cursor:default}.slot{background:#111a31;border:2px dashed #64748b}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}button.action,select{background:#7556e8;color:white;border:0;border-radius:12px;padding:13px 17px;font-size:16px;cursor:pointer}button.secondary{background:#334566}.message{min-height:28px;color:#fbbf24;font-weight:bold;margin:14px}.hidden{display:none}select{width:100%;margin:12px 0}footer{color:#9baacd;margin-top:18px;font-size:13px}@media(max-width:390px){.app{padding:16px}.tile{width:42px;height:48px}}
</style></head><body><main class="app"><div style="font-size:42px">🧩</div><h1>تحدي الكلمات مع عبد الله</h1><p>رتّب الحروف واكتشف الكلمة قبل انتهاء الوقت!</p><section id="start"><label for="level">اختر مستوى التحدي</label><select id="level"><option value="easy">سهل — 30 ثانية</option><option value="medium">متوسط — 22 ثانية</option><option value="hard">صعب — 15 ثانية</option></select><button class="action" id="play">ابدأ اللعب 🚀</button><p>أفضل نتيجة: <b id="best">0</b></p></section><section id="game" class="hidden"><div class="top"><div class="stat">النقاط<strong id="score">0</strong></div><div class="stat">السؤال<strong id="round">1 / 10</strong></div><div class="stat">الوقت<strong id="time">30</strong></div></div><div class="bar"><span id="progress"></span></div><div class="hint" id="clue"></div><div class="slots" id="slots" aria-label="الحروف المختارة"></div><div class="letters" id="letters" aria-label="الحروف المتاحة"></div><div class="message" id="message" aria-live="polite"></div><div class="actions"><button class="action secondary" id="undo">تراجع ↩</button><button class="action secondary" id="help">تلميح 💡 (-5)</button><button class="action" id="check">تحقق ✓</button></div></section><section id="end" class="hidden"><h2 id="result"></h2><p id="summary"></p><button class="action" id="again">العب مجددًا 🔄</button></section><footer>صُنعت للمتعة والتحدي ✨</footer></main><script>
const bank={easy:[['قلم','نكتب به'],['شمس','تضيء النهار'],['بحر','ماء مالح واسع'],['كتاب','نقرأ صفحاته'],['قمر','يظهر في السماء ليلًا'],['بيت','مكان نسكن فيه'],['ورد','زهرة جميلة'],['باب','ندخل منه'],['نجم','يلمع في السماء'],['مطر','يسقط من السحاب'],['تفاح','فاكهة حمراء أو خضراء'],['ساعة','تقيس الوقت']],medium:[['مدرسة','مكان نتعلم فيه'],['حديقة','مكان فيه أشجار وأزهار'],['طائرة','وسيلة نقل تطير'],['مفتاح','نفتح به الباب'],['مكتبة','مكان الكتب'],['نافذة','نرى من خلالها الخارج'],['برتقال','فاكهة حمضية'],['هاتف','نتصل به'],['سيارة','وسيلة نقل على الطريق'],['حاسوب','جهاز إلكتروني للعمل واللعب']],hard:[['استكشاف','البحث عن أماكن أو أشياء جديدة'],['مغامرة','تجربة مليئة بالمفاجآت'],['معلومات','حقائق ومعارف'],['تكنولوجيا','تقنيات وأجهزة حديثة'],['مستقبل','الزمن الذي لم يأتِ بعد'],['اختراعات','أشياء جديدة ابتكرها الإنسان'],['منافسة','تحدٍّ بين مشاركين'],['استراتيجية','خطة لتحقيق هدف'],['رياضيات','علم الأعداد والحساب'],['مسؤولية','واجب يُطلب منك أداؤه']]};
const $=id=>document.getElementById(id);let questions=[],index=0,score=0,seconds=30,timer=null,chosen=[],tiles=[],locked=false,level='easy';const durations={easy:30,medium:22,hard:15};const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function best(){try{return Number(localStorage.getItem('abdullah_words_best')||0)}catch{return 0}}function save(n){try{localStorage.setItem('abdullah_words_best',String(n))}catch{}}function show(id){['start','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function start(){clearInterval(timer);level=$('level').value;questions=shuffle(bank[level]).slice(0,10);index=0;score=0;show('game');next()}function next(){clearInterval(timer);if(index>=questions.length){finish();return}locked=false;chosen=[];seconds=durations[level];tiles=shuffle([...questions[index][0]].map((char,id)=>({char,id})));$('message').textContent='';$('score').textContent=score;$('round').textContent=(index+1)+' / '+questions.length;$('clue').textContent='🔎 '+questions[index][1];draw();tick();timer=setInterval(()=>{seconds--;tick();if(seconds<=0)resolve(false,'⏰ انتهى الوقت!')},1000)}function tick(){$('time').textContent=seconds;$('progress').style.width=(seconds/durations[level]*100)+'%'}function draw(){$('slots').replaceChildren();$('letters').replaceChildren();let word=questions[index][0];for(let i=0;i<word.length;i++){let b=document.createElement('button');b.className='tile slot';b.textContent=chosen[i]===undefined?'؟':tiles[chosen[i]].char;b.disabled=locked;b.onclick=()=>{if(chosen[i]!==undefined){chosen.splice(i,1);draw()}};$('slots').append(b)}tiles.forEach((t,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=t.char;b.disabled=locked||chosen.includes(i);b.onclick=()=>{if(chosen.length<word.length){chosen.push(i);draw()}};$('letters').append(b)})}function resolve(correct,msg){if(locked)return;locked=true;clearInterval(timer);if(correct){score+=10+Math.ceil(seconds/5);$('score').textContent=score}$('message').textContent=msg;draw();setTimeout(()=>{index++;next()},1100)}function finish(){clearInterval(timer);if(score>best())save(score);$('best').textContent=best();$('result').textContent='🎉 انتهى التحدي!';$('summary').textContent='جمعت '+score+' نقطة. أفضل نتيجة: '+best();show('end')}$('check').onclick=()=>{if(locked)return;let word=questions[index][0];if(chosen.length!==word.length){$('message').textContent='اختر جميع الحروف أولًا';return}let answer=chosen.map(i=>tiles[i].char).join('');if(answer===word)resolve(true,'✅ ممتاز! إجابة صحيحة');else{$('message').textContent='❌ حاول مرة ثانية';score=Math.max(0,score-2);$('score').textContent=score}};$('undo').onclick=()=>{if(!locked){chosen.pop();draw()}};$('help').onclick=()=>{if(locked)return;if(score<5){$('message').textContent='تحتاج 5 نقاط للحصول على تلميح';return}score-=5;$('score').textContent=score;let word=questions[index][0];$('message').textContent='💡 أول حرف: '+word[0]};$('play').onclick=start;$('again').onclick=start;$('best').textContent=best();
</script></body></html>
